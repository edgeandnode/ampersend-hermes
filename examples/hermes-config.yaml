# Example ~/.hermes/config.yaml after running `pnpm setup`
#
# This shows what patchHermesConfig() writes into your Hermes config.
# You can also copy the relevant mcp_servers section manually if you
# prefer not to use the automated patching.
#
# The ampersend MCP server runs as a stdio child process. It exposes a
# single `paid_fetch` tool that handles x402 payment challenges
# automatically via the agent's smart account.
#
# Replace the `args` path with the actual absolute path to your clone.
# `pnpm setup` fills this in automatically.

mcp_servers:
  ampersend:
    command: node
    args:
      - "/path/to/ampersend-hermes/dist/mcp/fetch-server.js"
    env:
      AMPERSEND_AGENT_KEY: "0xYourSessionKeyPrivateKey"
      AMPERSEND_AGENT_ACCOUNT: "0xYourSmartAccountAddress"
      AMPERSEND_API_URL: "https://api.ampersend.ai"
      AMPERSEND_NETWORK: "base"
    timeout: 120
    connect_timeout: 60

# ─── Your existing config ──────────────────────────────────────────────
#
# patchHermesConfig() merges the ampersend entry into your existing
# mcp_servers block without touching other servers. For example, if
# you already have other MCP servers configured:
#
# mcp_servers:
#   my_other_server:
#     url: "http://localhost:8080/mcp"
#   ampersend:
#     command: node
#     args: ["/path/to/ampersend-hermes/dist/mcp/fetch-server.js"]
#     env:
#       AMPERSEND_AGENT_KEY: "0x..."
#       AMPERSEND_AGENT_ACCOUNT: "0x..."
#       AMPERSEND_API_URL: "https://api.ampersend.ai"
#       AMPERSEND_NETWORK: "base"
#     timeout: 120
#     connect_timeout: 60

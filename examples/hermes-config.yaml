# Example ~/.hermes/config.yaml — CLI-first integration
#
# ampersend-hermes no longer patches Hermes config with a custom MCP server.
# Instead, agents use the `ampersend` CLI directly from the terminal:
#
#   ampersend fetch --inspect <url>   # check cost (no charge)
#   ampersend fetch <url>             # fetch and auto-pay x402
#
# If you want to add ampersend as a stdio MCP tool yourself, you can
# point it at the official CLI binary:
#
# mcp_servers:
#   ampersend:
#     command: ampersend
#     args: ["mcp"]
#     timeout: 120
#     connect_timeout: 60
#
# But the recommended approach is to just use `ampersend fetch` from the
# agent's shell. See AGENTS.md and skills/ampersend/SKILL.md for details.
